<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>

    <div class="container">
        <h1>Todo List</h1>
        
        <form id="todo-form">
            <input type="text" id="task-input" placeholder="Add a todo...">
            <input type="date" id="date-input">
            <button type="submit" class="btn btn-add">+</button>
        </form>

        <div class="controls">
            <button id="filter-btn" class="btn btn-filter">Filter (Show All)</button>
            <button id="delete-all-btn" class="btn btn-delete-all">Delete All</button>
        </div>

        <div class="task-list-header">
            <div class="header-task">TASK</div>
            <div class="header-date">DUE DATE</div>
            <div class="header-status">STATUS</div>
            <div class="header-actions">ACTIONS</div>
        </div>
        <ul id="task-list">
            </ul>
    </div>

</body>
</html>
